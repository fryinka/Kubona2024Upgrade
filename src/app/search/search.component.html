<div class="md:pt-8 py-5 lg:px-0 px-3">
  <div class="max-w-6xl mx-auto">
    <div class="grid grid-cols-12 items-center gap-x-2 md:gap-x-5 gap-y-2 md:gap-y-4">
      <!-- Search Bar -->
      <div class="col-span-12">
        <div class="relative">
          <img src="assets/images/icon-search.png" class="absolute top-1/2 -translate-y-1/2 left-2.5 max-w-[25px]"
            alt="" />
            <input type="search" [(ngModel)]="searchQuery" (input)="onSearchChange()"
              class="w-full h-[45px] pl-10 pr-3 bg-[#F2F2F2] border-0 placeholder:italic"
              placeholder="Type to search..." />
        </div>
      </div>

      <!-- Advanced Filters Button -->
      <!-- <div class="col-span-12">
        <button (click)="toggleAdvancedFilters()" class="montserrat-600 cursor-pointer">ADVANCED FILTERS</button>
      </div> -->
    </div>


    <!-- bg-[#f5f5f5] p-5  || [ngClass]="{'hidden': !advancedFilters}" || Advanced Filters Section -->
    <div class="mt-3">
      <div class="grid grid-cols-12 md:gap-5 gap-3">
        <div class="lg:col-span-6 col-span-6">
          <div class="custom-select-wrapper">
            <select [(ngModel)]="selectedSize" (change)="selectedSizeClick($event)"
              class="w-full py-3 md:text-[20px] text-[15px] border-none focus:outline-none custom-select">
              <option value="0">Select Size</option>
              <option *ngFor="let item of sizes" [value]="item.sizeCode">
                {{ item.sizeDesc }}
              </option>
            </select>
          </div>
        </div>
        <div class="lg:col-span-6 col-span-6">
          <div class="custom-select-wrapper">
            <select [(ngModel)]="selectedColors" (change)="onColorChange($event)"
              class="w-full py-3 md:text-[20px] text-[15px] border-none focus:outline-none custom-select">
              <option value="0">Select Color</option>
              <option *ngFor="let item of colors" [value]="item.colorId">
                {{ item.colorDesc }}
              </option>
            </select>
          </div>
        </div>
        <div class="lg:col-span-6 col-span-6">
          <div class="custom-select-wrapper">
            <select [(ngModel)]="selectedStyles" (change)="onStyleChange($event)"
              class="w-full py-3 md:text-[20px] text-[15px] border-none focus:outline-none custom-select">
              <option value="0">Select Style</option>
              <option *ngFor="let item of styles" [value]="item.styleId">
                {{ item.styleDesc }}
              </option>
            </select>
          </div>
        </div>
        <div class="lg:col-span-6 col-span-6">
          <div class="custom-select-wrapper">
            <select [(ngModel)]="selectedMaterial" (change)="onMaterialChange($event)"
              class="w-full py-3 md:text-[20px] text-[15px] border-none focus:outline-none custom-select">
              <option value="0">Select Material</option>
              <option *ngFor="let item of materials" [value]="item.materialId">
                {{ item.materialDesc }}
              </option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Products Section -->
<div class="md:pb-12 pb-5 lg:px-0 px-3">
  <div class="max-w-6xl mx-auto">
    <div class="grid grid-cols-12 md:gap-y-5">
      <div class="col-span-12">
        <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" *ngIf="isProducts"
          id="products" style="overflow-y: auto; max-height: 1200px" (scroll)="onScroll($event)">
          <div *ngFor="let item of displayedProducts" class="relative cursor-pointer"
            (click)="viewProduct(item.destinationUrl)">
            <div class="relative overflow-hidden bg-white shadow-lg rounded-lg h-full flex flex-col">
              <!-- Responsive Image -->
              <img *ngIf="item.image1Url" src="{{ item.image1Url }}" alt="{{item.title}}"
                class="w-full h-auto object-cover" />

              <img *ngIf="!item.image1Url" src="assets/images/placeholder.png" alt="Placeholder Image"
                class="w-full h-auto object-cover" />

              <div class="px-4 pb-3 flex-1 flex flex-col justify-between">
                <h5 class="montserrat-500 text-[14px] mt-2 capitalize-nowrap">
                  {{ item.title }}
                </h5>
                <div class="mt-2">
                  <span class="text-[20px] text-[#000] font-bold md:inline block md:mr-2">
                    {{ item.internetPrice | currency:'₦' :'symbol':'3.2'}}
                  </span>
                  <span class="text-[16px] line-through text-[#a0a0a0]">
                    {{item.storePrice| currency:'₦' :'symbol':'3.2'}}</span>
                </div>
                <div class="mt-2 flex justify-between items-center">
                  <ul class="flex flex-row gap-x-2 mt-1">
                    <li>
                      <a href="" class="block w-[20px] h-[20px] border-[1px] border-[#e2e2e2] rounded-full"
                        [ngStyle]="{ 'background-color': item.colorDesc }"></a>
                    </li>
                  </ul>
                  <span class="flex justify-between items-center text-[13px] capitalize">
                    <span>
                      <span></span>
                      <span [ngStyle]="{ color: item.colorDesc }"></span>
                    </span>
                    <span><img src="assets/images/buy-cart.png" class="max-w-[40px]" alt="Cart Icon" /></span>
                  </span>
                </div>
                <ul class="flex flex-wrap gap-x-2 md:mt-0 mt-1">
                  <li *ngFor="let i of extractSizeNumber(item.sizeDesc)">
                    <span class="text-[14px] cursor-pointer text-black-400" (click)="selectedSizeClick($event)">{{ i
                      }}</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <div *ngIf="!isLoading && !isProducts">
          <div class="bg-[#f5f5f5] md:p-16 p-5 text-center">
            <span class="montserrat-600">NO PRODUCTS FOUND THIS MOMENT</span>
          </div>
        </div>
      </div>
      <div *ngIf="isLoading" class="col-span-12 text-center my-5">
        <div class="loader"></div>
        <p>Loading Products...</p>
      </div>
    </div>
  </div>
</div>
