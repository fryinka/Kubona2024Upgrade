<div class="container mx-auto mt-8 px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-lg shadow-md p-6">
      <form [formGroup]="verifyForm" (ngSubmit)="completeOrder()">
        <div class="mb-6">
          <label for="gsm" class="block text-sm font-medium text-gray-700 mb-2 font-bold">
            <span class="text-red-600">*</span> Please select the best option for your order below:
          </label>
  
          <div class="space-y-4">
            <div class="flex items-start">
              <div class="flex items-center h-5">
                <input class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500" 
                       type="radio" name="paymentOption" [value]="104" 
                       formControlName="paymentOption" id="paymentOption1">
              </div>
              <label class="ml-3 text-sm font-medium text-gray-700" for="paymentOption1">
                I am ready to proceed with my 
                <span *ngIf="total" class="text-green-600 font-bold">
                  {{total | currency: "₦":"symbol":"3.2"}}
                </span>
                <span *ngIf="!total" class="text-green-600 font-bold">order</span>.
                It is within my budget.
              </label>
            </div>
  
            <div class="flex items-start">
              <div class="flex items-center h-5">
                <input class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500" 
                       type="radio" name="paymentOption" [value]="105" 
                       formControlName="paymentOption" id="paymentOption2">
              </div>
              <label class="ml-3 text-sm font-medium text-gray-700" for="paymentOption2">
                I understand the pricing and I'm ready for delivery within the next 3-5 weeks.
              </label>
            </div>
  
            <div class="flex items-start">
              <div class="flex items-center h-5">
                <input class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500" 
                       type="radio" name="paymentOption" [value]="102" 
                       formControlName="paymentOption" id="paymentOption3">
              </div>
              <label class="ml-3 text-sm font-medium text-gray-700" for="paymentOption3">
                I am interested, but please explain the price before placing my order.
              </label>
            </div>
          </div>
  
          <div *ngIf="submitted && verifyForm.get('paymentOption')?.invalid" 
               class="text-red-600 text-xs mt-2">
            PLEASE SELECT AN OPTION ABOVE
          </div>
        </div>
  
        <div>
          <button type="submit" 
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
